<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGRSI - Solicitudes</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/headeryFooter.css">
    <link rel="stylesheet" href="../css/menuHamburguesa.css">
    <link rel="stylesheet" href="../css/panelTecnico.css">
    <link rel="stylesheet" href="../css/solicitud.css">
</head>
<body>
    <header>
        <img src="../../../assets/iconos/GreenCurlLogo.png" alt="Logo SGRSI">
        <div>
            <h1 class="System_title">SGRSI</h1>
            <p class="Parrafo">Sistema de gestión de recursos y soporte de informática</p>
        </div>
        <button class="btn_hamburguesa" id="btn_hamburguesa" title="Menú">
            <span></span><span></span><span></span>
        </button>
        <nav class="menu_desplegable" id="menu_desplegable">
            <a href="panelIncidencias.html" class="menu_item">Panel de incidencias</a>
            <a href="panelSolicitudes.html" class="menu_item menu_item_activo">Panel de solicitudes</a>
        </nav>
    </header>

    <main>
        <h2 class="titulo_panel">Panel de solicitudes</h2>
        <section class="panel_card solicitudes_card">
            <div class="solicitudes_encabezado">
                <p>Solicitudes de software y recursos</p>
                <label for="filtro">Filtrar por
                    <select name="filtro" id="filtro">
                        <option value="todos">Todos</option>
                        <option value="sinResolver">Sin resolver</option>
                        <option value="enProceso">En proceso</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="prioridadAlta">Prioridad alta</option>
                        <option value="prioridadMedia">Prioridad media</option>
                        <option value="prioridadBaja">Prioridad baja</option>
                    </select>
                </label>
            </div>
            <ul class="solicitudes_lista">
                <li class="solicitud_item alta sinResolver">
                    <div><h3>Sin resolver</h3><small>VS Code 20.2</small></div><span>Alta</span>
                </li>
                <li class="solicitud_item media enProceso">
                    <div><h3>En proceso</h3><small>Apache NetBeans 10.1</small></div><span>Media</span>
                </li>
                <li class="solicitud_item baja resuelto">
                    <div><h3>Resuelto</h3><small>XAMPP</small></div><span>Baja</span>
                </li>
            </ul>
        </section>
    </main>

    <script src="../js/menuHamburguesa.js"></script>
    <script src="../js/solicitudes.js"></script>
    <script src="../js/auth.js"></script>
    <script>protegerRuta('tecnico');</script>
</body>
</html>
